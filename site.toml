# Site-wide settings. Edit here, then run: python3 build.py

title = "Rendering Molecules in Blender"
tagline = "A workbook for structural biologists: materials, light, shaders, Geometry Nodes and Molecular Nodes, taught through exercises in Blender 5.2."
blender = "Blender 5.2 LTS"
# The repository on GitHub. It switches on the "Report this passage" button and the link to the source;
# leave it empty to hide both.
repo = "https://github.com/THATjiaze/rendering-molecules-in-blender"

# One entry per part, in reading order. `file` is the Markdown file in content/ (without .md),
# `slug` is the page name, `socket` picks the part's color (a Blender socket type),
# `graph` places the part on the front page's node graph: [column, row].

[[part]]
file = "01-material-recipes"
slug = "material-recipes"
short = "Recipes"
socket = "material"
gives = "Named looks"
blurb = "Settings tables for named looks, from slime and frosted glass to matte clay, all on one Principled BSDF."
graph = [1, 1]

[[part]]
file = "02-designing-a-look"
slug = "designing-a-look"
short = "Designing a look"
socket = "color"
gives = "A look of your own"
blurb = "Five questions that turn a texture you can picture into settings, asked in the order light meets the surface."
graph = [2, 1]

[[part]]
file = "03-lighting"
slug = "lighting"
short = "Lighting"
socket = "string"
gives = "A lit scene"
blurb = "Direction, softness and contrast first, then the named setups, then inventing a setup of your own."
graph = [3, 0]

[[part]]
file = "04-shaders"
slug = "shaders"
short = "Shaders"
socket = "shader"
gives = "Materials built from parts"
blurb = "Every shader node Blender offers, what feeds one, the render engines, and flat, stylized looks for figures."
graph = [3, 1]

[[part]]
file = "05-geometry-nodes"
slug = "geometry-nodes"
short = "Geometry Nodes"
socket = "geometry"
gives = "Trees you can read and build"
blurb = "Node trees, attributes and fields, then volumes and SDFs, ending with a sticky-slime map and local-resolution coloring."
graph = [1, 2]

[[part]]
file = "06-geometry-nodes-for-art"
slug = "geometry-nodes-for-art"
short = "Geometry Nodes for art"
socket = "vector"
gives = "Procedural pieces"
blurb = "The same nodes fed by formulas instead of files: instances, variation, curves and motion in three worked pieces."
graph = [2, 2]

[[part]]
file = "07-molecular-nodes"
slug = "molecular-nodes"
short = "Molecular Nodes"
socket = "boolean"
gives = "Selections, as in ChimeraX"
blurb = "Selections as boolean fields: each Select node, when to use it, and the plain Geometry Nodes inside it."
graph = [2, 3]

[[part]]
file = "08-objects-and-modeling"
slug = "objects-and-modeling"
short = "Objects and modeling"
socket = "object"
gives = "A staged scene"
blurb = "Selecting, placing and parenting objects, Edit Mode, modifiers, curves and the camera, with a cartoon house to practice on."
graph = [1, 0]

[[part]]
file = "09-art-direction"
slug = "art-direction"
short = "Art direction"
socket = "matrix"
gives = "The whole picture"
blurb = "Seven decisions made together for one sentence, from form and stage to palette and air, then four complete looks to build, take apart and outgrow."
graph = [4, 1.5]

[[part]]
file = "10-composition-and-layout"
slug = "composition-and-layout"
short = "Composition and layout"
socket = "bundle"
gives = "A page that reads"
blurb = "Arranging things so a viewer sees what matters first: hierarchy, grouping, the grid, the frame and the eye path, applied to figures, posters, renders and manga pages."
graph = [4, 2.5]

# Wires on the front-page graph: [from, to]. "in" and "out" are the Group Input and Group Output nodes;
# a wire into "out" names the socket it lands on.
