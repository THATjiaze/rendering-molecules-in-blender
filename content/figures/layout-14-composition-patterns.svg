</g> <text x="132" y="182" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Thirds</text> <text x="132" y="200" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">the subject on a crossing</text> <text x="380" y="182" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Symmetry</text> <text x="380" y="200" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">mirrored halves, one axis</text> <text x="628" y="182" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Diagonal</text> <text x="628" y="200" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">masses along one slope</text> <text x="132" y="344" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Triangle</text> <text x="132" y="362" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">three points, broad base</text> <text x="380" y="344" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">L-frame</text> <text x="380" y="362" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">a tall side and a low base</text> <text x="628" y="344" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">S-curve</text> <text x="628" y="362" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">a winding way in</text> <text x="132" y="506" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Radial</text> <text x="132" y="524" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">lines meet at one point</text> <text x="380" y="506" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Frame within a frame</text> <text x="380" y="524" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">seen through an opening</text> <text x="628" y="506" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Steelyard</text> <text x="628" y="524" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">large near, small far</text> </svg>
