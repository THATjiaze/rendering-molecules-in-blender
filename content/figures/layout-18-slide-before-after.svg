</g> <text x="24" y="287" font-size="11.5" fill="var(--fig-muted, #5b616b)">The title is a label, and the bullets repeat the talk.</text> <text x="24" y="304" font-size="11.5" fill="var(--fig-muted, #5b616b)">The evidence is the smallest thing on the slide.</text> <text x="396" y="287" font-size="11.5" fill="var(--fig-muted, #5b616b)">The title states the conclusion.</text> <text x="396" y="304" font-size="11.5" fill="var(--fig-muted, #5b616b)">One large figure, with the accent on the point.</text> </svg>
