<text x="684" y="90" text-anchor="end" font-size="11.5" fill="var(--fig-muted, #5b616b)">Frosted, ghosted</text>
<text x="136" y="428" font-size="11.5" fill="var(--fig-muted, #5b616b)">Polished</text>
<text x="684" y="428" text-anchor="end" font-size="11.5" fill="var(--fig-muted, #5b616b)">Soft, chalky</text>
</g>
<g>
<circle cx="172" cy="132" r="7" fill="var(--fig-accent, #0f9d7a)"/>
