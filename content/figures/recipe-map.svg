<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 760 488" role="img" aria-label="Two settings place most looks; slime is glossy and see-through" font-size="13">
<text x="24" y="34" font-size="15" font-weight="600" fill="var(--fig-ink, #1a1c20)">Two settings place most looks; slime is glossy and see-through</text>
<g>
<rect x="120" y="64" width="580" height="376" rx="8" fill="none" stroke="var(--fig-line, #6b7280)" stroke-width="1.25"/>
<line x1="410" y1="64" x2="410" y2="440" stroke="var(--fig-grid, #c9cdd3)"/>
<line x1="120" y1="252" x2="700" y2="252" stroke="var(--fig-grid, #c9cdd3)"/>
</g>
<g>
<text x="24" y="90" font-size="11.5" fill="var(--fig-muted, #5b616b)">See-through</text>
<text x="24" y="432" font-size="11.5" fill="var(--fig-muted, #5b616b)">Opaque</text>
<text x="120" y="464" font-size="11.5" fill="var(--fig-muted, #5b616b)">Glossy</text>
