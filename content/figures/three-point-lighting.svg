<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 760 480" role="img" aria-label="Three-point lighting: key for form, fill for contrast, rim for separation" font-size="13">
<defs>
<marker id="light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="var(--fig-line, #6b7280)"/>
</marker>
</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="var(--fig-ink, #1a1c20)">Three-point lighting: key for form, fill for contrast, rim for separation</text>
<g fill="none" stroke="var(--fig-line, #6b7280)" stroke-width="1.25">
<path d="M256 354L350 260" stroke-dasharray="4 4" marker-end="url(#light-arrow)"/>
<path d="M504 354L410 260" stroke-dasharray="4 4" marker-end="url(#light-arrow)"/>
<path d="M504 106L410 200" stroke-dasharray="4 4" marker-end="url(#light-arrow)"/>
<path d="M380 400V272" stroke="var(--fig-grid, #c9cdd3)"/>
</g>
<g>
<circle cx="380" cy="230" r="32" fill="none" stroke="var(--fig-line, #6b7280)" stroke-width="1.25"/>
<text x="380" y="234" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Subject</text>
</g>
<g>
<rect x="362" y="410" width="36" height="26" rx="4" fill="none" stroke="var(--fig-line, #6b7280)" stroke-width="1.25"/>
<polygon points="372,410 388,410 380,400" fill="var(--fig-line, #6b7280)"/>
<text x="380" y="456" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">Camera</text>
</g>
<g>
<line x1="218" y1="350" x2="260" y2="392" stroke="var(--fig-accent, #0f9d7a)" stroke-width="5"/>
<text x="24" y="356" font-weight="600" fill="var(--fig-ink, #1a1c20)">Key</text>
<text x="24" y="374" font-size="11.5" fill="var(--fig-muted, #5b616b)">Soft, 45° off the axis,</text>
<text x="24" y="390" font-size="11.5" fill="var(--fig-muted, #5b616b)">the brightest light</text>
</g>
<g>
<line x1="489" y1="403" x2="553" y2="339" stroke="var(--fig-line, #6b7280)" stroke-width="5"/>
<text x="600" y="356" font-weight="600" fill="var(--fig-ink, #1a1c20)">Fill</text>
<text x="600" y="374" font-size="11.5" fill="var(--fig-muted, #5b616b)">Larger, a third as</text>
<text x="600" y="390" font-size="11.5" fill="var(--fig-muted, #5b616b)">bright, opposite side</text>
</g>
<g>
<line x1="507" y1="75" x2="535" y2="103" stroke="var(--fig-line, #6b7280)" stroke-width="4"/>
<text x="600" y="80" font-weight="600" fill="var(--fig-ink, #1a1c20)">Rim</text>
<text x="600" y="98" font-size="11.5" fill="var(--fig-muted, #5b616b)">Behind, opposite the</text>
<text x="600" y="114" font-size="11.5" fill="var(--fig-muted, #5b616b)">key; draws the edge</text>
</g>
<text x="24" y="456" font-size="11.5" fill="var(--fig-muted, #5b616b)">Plan view from above</text>
</svg>
