</g> <text x="24" y="316" font-size="11.5" fill="var(--fig-muted, #5b616b)">Four equal boxes: the key result hides among controls.</text> <text x="24" y="333" font-size="11.5" fill="var(--fig-muted, #5b616b)">Legends sit far from the curves they explain.</text> <text x="396" y="316" font-size="11.5" fill="var(--fig-muted, #5b616b)">The key panel gets the area and the only accent.</text> <text x="396" y="333" font-size="11.5" fill="var(--fig-muted, #5b616b)">Labels sit on the data. Small panels share axis lines.</text> </svg>
