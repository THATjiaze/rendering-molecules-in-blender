</g> <text x="107" y="196" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Centered</text> <text x="107" y="214" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">calm and static;</text> <text x="107" y="230" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">the horizon halves the frame</text> <text x="289" y="196" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">On a third</text> <text x="289" y="214" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">the room ahead of her reads</text> <text x="289" y="230" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">as a journey to the gate</text> <text x="471" y="196" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Facing out</text> <text x="471" y="214" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">the eye follows her out,</text> <text x="471" y="230" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">and the space behind is dead</text> <text x="653" y="196" text-anchor="middle" font-weight="600" fill="var(--fig-ink, #1a1c20)">Tangents</text> <text x="653" y="214" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">head on the horizon,</text> <text x="653" y="230" text-anchor="middle" font-size="11.5" fill="var(--fig-muted, #5b616b)">moon and beam on the edge</text> </svg>
